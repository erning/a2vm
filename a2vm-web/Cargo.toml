[package]
name = "a2vm-web"
version = "0.1.0"
edition = "2021"
authors = ["A2VM Contributors"]
description = "WebAssembly frontend for A2VM Apple II emulator"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
a2vm-core = { path = "../a2vm-core", default-features = false }
wasm-bindgen = "0.2.87"
js-sys = "0.3.64"
web-sys = { version = "0.3.64", features = [
    "console",
    "CanvasRenderingContext2d",
    "ImageData",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "Performance",
] }

[profile.release]
opt-level = 3
lto = true
